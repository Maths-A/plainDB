version: '3.8'

services:
  plaindb-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plaindb-backend
    ports:
      - "8000:8000"
    environment:
      - PLAINDB_DB_PATH=/data/plaindb.sqlite
      - PLAINDB_HOST=0.0.0.0
      - PLAINDB_PORT=8000
    volumes:
      - plaindb_data:/data
    networks:
      - plaindb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  plaindb_data:
    driver: local

networks:
  plaindb-network:
    driver: bridge
